services:
  - type: web
    name: kicpaa-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: KicpaaApi
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-dbbiffvavr4c73e07bg0-a
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: api_cxol
      - key: DB_USERNAME
        value: api_cxol_user
      - key: DB_PASSWORD
        sync: false
