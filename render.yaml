services:
  - type: web
    name: kicpaa-api
    runtime: docker
    rootDir: Backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: KicpaaApi
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: db.fr-roub1.bengt.wasmernet.com
      - key: DB_PORT
        value: "20184"
      - key: DB_DATABASE
        value: kicpaaapi
      - key: DB_USERNAME
        value: user_812307a7
      - key: DB_PASSWORD
        value: pw_DStqhVTjcAz4vO6tkvCxHAjFXzC2nehc
